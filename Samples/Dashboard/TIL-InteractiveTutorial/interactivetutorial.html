<!DOCTYPE html>
<html lang="en">

<head>
  <title>Be Free Sample</title>
  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>

  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" />
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>

  <!-- Extensions Library (this will be hosted on a CDN eventually) -->
  <script src="../../../lib/tableau.extensions.1.latest.beta.js"></script>

  <!-- Our extension's code -->
  <script src="./til-it.js"></script>

  <style>
    .container {
      display: none;
    }

    .form {
      display: grid;
      grid-gap: 1rem;
      grid-template-columns: [label] auto [input] 1fr;
      margin-top: 2rem;
    }

    input {
      grid-column: input;
      align-self: center;
    }

    label {
      grid-column: label;
      text-align: right;
    }

    textarea {
      resize: vertical;
      font-family: monospace;
    }

    .examples,
    .themes {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    #custom-theme {
      display: none;
    }

    video {
      width: 427px;
      height: 240px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div>
      <div>
        <h2>Let's See if This Works!</h2>
        <div class="examples">
          <button id="load-first-sheet" class="btn btn-primary">Step 1 - Load the first sheet</button>
        </div>
        <div class="examples">
          <button id="sex-to-rows" class="btn btn-primary">Step 2 - Put dimension Sex on rows</button>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
